# Claude Code on GitHub: answers @claude mentions on issues and pull requests.
# Installed for Agent Hub's "GitHub as a computer" (see github-hub/README.md).
# Needs the Claude GitHub App on this repo (https://github.com/apps/claude) and
# the CLAUDE_CODE_OAUTH_TOKEN repository secret (from `claude setup-token`).
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (github.event.comment && contains(github.event.comment.body, '@claude')) ||
      (github.event.issue && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
