name: Build suyu libretro core (Windows)

# Drop this file at .github/workflows/libretro-core.yml in your suyu fork.
#
# It expects the patch produced earlier - suyu-frontend-dirs.patch - to be
# committed in the repo at patches/suyu-frontend-dirs.patch. If that file
# isn't there, the patch step is skipped and it just builds vanilla suyu.
# (If you've instead committed the already-patched retro_core.cpp directly,
# delete the "Apply frontend-dirs patch" step below - it's redundant then.)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/libretro_core/**"
      - "patches/**"
      - ".github/workflows/libretro-core.yml"

jobs:
  build-libretro-windows:
    name: Libretro core (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init submodules
        run: |
          git -c submodule."externals/ownfoil".update=none -c submodule."externals/nxdumptool".update=none -c submodule."externals/nxapi".update=none -c submodule."externals/nx-optimizer".update=none submodule update --init --recursive --depth=1

      - name: Fix submodule headers
        shell: bash
        run: |
          f="externals/dynarmic/externals/mcl/include/boost/variant.hpp"
          if [ -f "$f" ] && grep -q 'C:/Users' "$f"; then
            printf '// Forwarding header\n#include <boost/variant/variant.hpp>\n#include <boost/variant/recursive_variant.hpp>\n#include <boost/variant/recursive_wrapper.hpp>\n#include <boost/variant/get.hpp>\n#include <boost/variant/apply_visitor.hpp>\n#include <boost/variant/static_visitor.hpp>\n#include <boost/variant/visitor_ptr.hpp>\n' > "$f"
          fi

      - name: Apply frontend-dirs patch
        shell: bash
        run: |
          if [ -f patches/suyu-frontend-dirs.patch ]; then
            if grep -q "RedirectSuyuPathsToFrontend" src/libretro_core/retro_core.cpp; then
              echo "Already applied, skipping."
            else
              git apply --whitespace=nowarn patches/suyu-frontend-dirs.patch
            fi
          else
            echo "No patches/suyu-frontend-dirs.patch found, building as-is."
          fi

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdkDir = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          echo "VULKAN_SDK=$($sdkDir.FullName)" >> $env:GITHUB_ENV
          echo "$($sdkDir.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Configure
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSUYU_BUILD_LIBRETRO_CORE=ON \
            -DENABLE_QT=OFF \
            -DYUZU_CMD=OFF \
            -DYUZU_TESTS=OFF \
            -DENABLE_WEB_SERVICE=OFF \
            -GNinja 2>&1 | tee cmake_configure.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload cmake log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-log-libretro-windows
          path: cmake_configure.log

      - name: Build
        run: cmake --build build --target suyu_libretro -j4

      - name: Package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force _pkg -ErrorAction SilentlyContinue
          New-Item -ItemType Directory _pkg | Out-Null
          Get-ChildItem build -Recurse -Filter suyu_libretro.dll | ForEach-Object { Copy-Item $_.FullName _pkg/ }
          Compress-Archive -Path _pkg/* -DestinationPath suyu-libretro-core-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: suyu-libretro-core-windows-x64
          path: suyu-libretro-core-windows-x64.zip
