name: Release

# Releases are cut from a tag, never on a timer.
#
# The version tag is the whole point: the release, the binaries and the source
# attached to it all describe the same commit. The previous version of this
# file ran on a cron, deleted the tag and recreated it against whatever was on
# the branch that morning, so the tag drifted off the commit it was supposed to
# name and the release stopped corresponding to any particular source.
#
# workflow_dispatch builds everything but publishes nothing, so the pipeline
# can be exercised without cutting a release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            no_jit: 'OFF'
            archive: suyu-linux-x86_64.tar.gz
          - variant: no-jit
            no_jit: 'ON'
            archive: suyu-linux-x86_64-no-jit.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          # X11/Wayland headers are not optional: SDL3 aborts configure without
          # one of them. glslang-tools supplies glslangValidator, which the host
          # shader step requires by name.
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config ninja-build nasm autoconf \
            qt6-base-dev qt6-base-dev-tools qt6-base-private-dev libqt6svg6-dev libqt6charts6-dev \
            qt6-multimedia-dev libqt6opengl6-dev glslang-tools \
            libboost-dev libboost-filesystem-dev libboost-context-dev \
            libusb-1.0-0-dev libssl-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libswscale-dev libswresample-dev \
            libzstd-dev liblz4-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxkbcommon-dev libxss-dev libxtst-dev \
            libwayland-dev libwayland-egl1 wayland-protocols libdecor-0-dev \
            libegl-dev libdrm-dev libgbm-dev libvulkan-dev
      - name: Install CMake 3.31
        # CMakeModules/CPMUtil.cmake requires 3.31; ubuntu-24.04 ships 3.28.
        run: |
          V=3.31.6
          curl -fsSL -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${V}/cmake-${V}-linux-x86_64.tar.gz"
          sudo mkdir -p /opt/cmake
          sudo tar xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          echo /opt/cmake/bin >> "$GITHUB_PATH"
      - name: Test static recompiler
        run: python tests/recompiler_smoke/run.py
      - name: Configure
        # fmt_FORCE_BUNDLED: the system fmt 9 has no format_string::get(), and
        # suyu only forces the bundled copy inside a branch that does not apply
        # to an ordinary Linux build.
        run: |
          cmake --version
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_TESTS=OFF -DENABLE_WEB_SERVICE=OFF \
            -DSUYU_NO_JIT=${{ matrix.no_jit }} \
            -Dfmt_FORCE_BUNDLED=ON
      - name: Build
        run: cmake --build build --target suyu suyu-cmd
      - name: Verify no-JIT build
        if: matrix.variant == 'no-jit'
        run: |
          grep -qx 'SUYU_NO_JIT:BOOL=ON' build/CMakeCache.txt
          ninja -C build -t inputs suyu suyu-cmd > build/no-jit-inputs.txt
          if grep -Ei '(^|[/\\])dynarmic([/\\.]|$)|arm_dynarmic|libdynarmic[.]a' build/no-jit-inputs.txt; then
            echo 'Dynarmic input found in the no-JIT build' >&2
            exit 1
          fi
          for target in suyu suyu-cmd; do
            nm -C "build/bin/$target" > "build/$target-symbols.txt"
            # A stripped or unreadable binary is not evidence of zero symbols.
            grep -Eq '[[:space:]][Tt][[:space:]]' "build/$target-symbols.txt"
            if grep -E 'Dynarmic::|dynarmic::' "build/$target-symbols.txt"; then
              echo "Dynarmic symbol found in $target" >&2
              exit 1
            fi
          done
          printf 'Source: %s\nSUYU_NO_JIT=ON\nNo Dynarmic target inputs or executable symbols.\n' "$GITHUB_SHA" > build/no-jit-audit.txt
      - name: Package
        run: |
          mkdir -p _pkg
          cp build/bin/suyu build/bin/suyu-cmd _pkg/
          cp LICENSE.txt _pkg/
          if [ -f build/no-jit-audit.txt ]; then cp build/no-jit-audit.txt _pkg/; fi
          tar -czf '${{ matrix.archive }}' -C _pkg .

      - name: Package AppImage
        if: matrix.variant == 'standard'
        run: bash scripts/package-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.variant }}
          path: |
            ${{ matrix.archive }}
            *.AppImage
          if-no-files-found: warn

  build-windows:
    name: Windows (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            no_jit: 'OFF'
            linker_flags: ''
            archive: suyu-windows-x86_64.zip
          - variant: no-jit
            no_jit: 'ON'
            linker_flags: '/MAP'
            archive: suyu-windows-x86_64-no-jit.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_msvc2022_64
          modules: qtcharts qtmultimedia
      - name: Install Vulkan SDK
        # Supplies glslangValidator. Vulkan headers themselves come from
        # externals/Vulkan-Headers, so nothing else here needs the SDK.
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH
      - name: Test static recompiler
        shell: pwsh
        run: python tests/recompiler_smoke/run.py
      - name: Configure
        shell: bash
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          cmake --version
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF \
            -DYUZU_TESTS=OFF -DENABLE_WEB_SERVICE=OFF \
            -DSUYU_NO_JIT=${{ matrix.no_jit }} \
            '-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.linker_flags }}'
      - name: Build
        shell: bash
        run: cmake --build build --target suyu suyu-cmd
      - name: Verify no-JIT build
        if: matrix.variant == 'no-jit'
        shell: pwsh
        run: |
          if (-not (Select-String -Path build/CMakeCache.txt -Pattern '^SUYU_NO_JIT:BOOL=ON$' -Quiet)) {
            throw 'No-JIT build setting is missing'
          }
          ninja -C build -t inputs suyu suyu-cmd | Set-Content build/no-jit-inputs.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Ninja inputs' }
          if (Select-String -Path build/no-jit-inputs.txt -Pattern '(^|[/\\])dynarmic([/\\.]|$)|arm_dynarmic|libdynarmic[.]a' -Quiet) {
            throw 'Dynarmic input found in the no-JIT build'
          }
          foreach ($target in @('suyu', 'suyu-cmd')) {
            $maps = @(Get-ChildItem build -Recurse -File -Filter "$target.map")
            if ($maps.Count -ne 1 -or $maps[0].Length -eq 0) {
              throw "Expected one nonempty link map for $target"
            }
            if (-not (Select-String -LiteralPath $maps[0].FullName -Pattern 'Publics by Value' -Quiet)) {
              throw "No public-symbol table found in $target link map"
            }
            # MSVC encodes UI text such as "Dynarmic" in ??_C@ literal symbols.
            # Exclude only those literals; retain every code/data symbol row.
            $symbols = @(Select-String -LiteralPath $maps[0].FullName -Pattern '^\s+[0-9a-f]+:[0-9a-f]+\s+(\S+)\s+[0-9a-f]{8,}\b' |
              Where-Object { -not $_.Matches[0].Groups[1].Value.StartsWith('??_C@') })
            if ($symbols.Count -eq 0) {
              throw "No nonliteral symbols found in $target link map"
            }
            if ($symbols.Line -match '@Dynarmic@|\bdynarmic[.]lib\b') {
              throw "Dynarmic symbol found in $target link map"
            }
          }
          @(
            "Source: $env:GITHUB_SHA"
            'SUYU_NO_JIT=ON'
            'No Dynarmic target inputs or executable link-map symbols.'
          ) | Set-Content build/no-jit-audit.txt
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _pkg | Out-Null
          Copy-Item build\bin\suyu.exe, build\bin\suyu-cmd.exe _pkg\
          Get-ChildItem build\bin -Filter *.dll | Copy-Item -Destination _pkg\
          if (Test-Path build\bin\plugins) { Copy-Item build\bin\plugins _pkg\ -Recurse }
          windeployqt --release --no-translations _pkg\suyu.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }
          Copy-Item LICENSE.txt _pkg\
          if (Test-Path build/no-jit-audit.txt) { Copy-Item build/no-jit-audit.txt _pkg\ }
          Compress-Archive -Path _pkg\* -DestinationPath '${{ matrix.archive }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.variant }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0
      - name: Archive the complete source, submodules included
        # GitHub's own "Source code" links exclude submodules, so on their own
        # they are not the corresponding source for these binaries. This one is
        # the tree the release was actually built from.
        run: |
          NAME="suyu-${GITHUB_REF_NAME:-manual}-source"
          git ls-files --recurse-submodules -z \
            | tar --null -T - -czf "${NAME}.tar.gz" --transform "s,^,${NAME}/,"
          ls -la "${NAME}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: '*.tar.gz'
          if-no-files-found: error

  publish:
    name: Publish
    # Only for a tag, and only when every build succeeded. The previous version
    # used `if: always()`, so a release could go out with a platform missing or
    # a failed build silently omitted.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} out/ \;
          for asset in \
            suyu-linux-x86_64.tar.gz \
            suyu-linux-x86_64-no-jit.tar.gz \
            suyu-windows-x86_64.zip \
            suyu-windows-x86_64-no-jit.zip \
            "suyu-${GITHUB_REF_NAME}-source.tar.gz"; do
            test -s "out/$asset"
          done
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "suyu $TAG" \
            --notes-file "docs/releases/$TAG.md" \
            out/*
